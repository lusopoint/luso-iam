services:
  postgres:
    # PostgreSQL 18 changed the data path. A 16 volume is not compatible.
    # For disposable dev data, run `make compose-dev-clear` and reseed.
    image: postgres:18-alpine
    container_name: iam-postgres
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    ports:
      - "5432:5432"
    volumes:
      - iam-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iam-pgdata:
