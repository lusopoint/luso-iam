# Traefik + IAM ForwardAuth example
#
# Same idea as the Caddy example next door, but expressed in Traefik's
# label-based middleware config. Traefik calls the directive `ForwardAuth`
# (capital F, capital A); semantics are the same as Caddy's `forward_auth`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 5s
      timeout: 3s
      retries: 10

  iam:
    build:
      context: ../../..
      dockerfile: deployments/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://iam:iam@postgres:5432/iam?sslmode=disable
      BASE_URL: https://auth.local
      SESSION_SECRET: "00000000000000000000000000000000change-me-in-real-deployments"
      SIGNING_KEY_PATH: /etc/iam/signing.pem
      SESSION_COOKIE_DOMAIN: .local
      PROXY_ALLOWED_CALLBACK_ORIGINS: https://app.local
      AUTO_MIGRATE: "true"
      COOKIES_SECURE: "true"
    volumes:
      - ./signing.pem:/etc/iam/signing.pem:ro
    labels:
      # Tell Traefik to route auth.local to the iam container.
      - "traefik.enable=true"
      - "traefik.http.routers.iam.rule=Host(`auth.local`)"
      - "traefik.http.routers.iam.entrypoints=websecure"
      - "traefik.http.routers.iam.tls=true"
      - "traefik.http.services.iam.loadbalancer.server.port=8080"

      # Define the ForwardAuth middleware once, here. Other services
      # reference it by name (`iam-forwardauth@docker`).
      #
      # `address` is the URL Traefik calls for each sub-request.
      # `authResponseHeaders` is the X-Auth-* set we want forwarded to
      # protected upstreams. Naming a header here means "copy from the
      # /proxy/verify response onto the request before it reaches the
      # upstream"
      - "traefik.http.middlewares.iam-forwardauth.forwardauth.address=http://iam:8080/proxy/verify"
      - "traefik.http.middlewares.iam-forwardauth.forwardauth.authResponseHeaders=X-Auth-Sub,X-Auth-User,X-Auth-Username,X-Auth-Email,X-Auth-Name,X-Auth-Groups"
      # Traefik forwards the original method+path+host to the auth server
      # by default, but you can also explicitly request X-Forwarded-*.
      - "traefik.http.middlewares.iam-forwardauth.forwardauth.trustForwardHeader=true"

  demo-app:
    build:
      context: ../caddy-forwardauth
      dockerfile: demo-app.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.demo.rule=Host(`app.local`)"
      - "traefik.http.routers.demo.entrypoints=websecure"
      - "traefik.http.routers.demo.tls=true"
      - "traefik.http.routers.demo.middlewares=iam-forwardauth@docker"
      - "traefik.http.services.demo.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Local-mode TLS via Traefik's built-in self-signed; for ACME, see
      # https://doc.traefik.io/traefik/https/acme/
      # --certificatesresolvers.le.acme.email=you@example.com
      # --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik dashboard (insecure, local dev only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
