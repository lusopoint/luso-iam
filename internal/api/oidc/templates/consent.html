<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authorize - IAM</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #161922;
          --border: #2a2f3a;
          --text: #e6e8eb;
          --muted: #9aa1ab;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
        width: 100%;
        max-width: 400px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.3rem;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.25rem;
        font-size: 0.9rem;
      }
      .scopes {
        list-style: none;
        padding: 0;
        margin: 0 0 1.5rem;
      }
      .scopes li {
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }
      .scopes li:last-child {
        border-bottom: none;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
      }
      .btn {
        flex: 1;
        padding: 0.55rem;
        font: inherit;
        font-weight: 500;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-allow {
        background: var(--accent);
        color: #fff;
      }
      .btn-allow:hover {
        background: var(--accent-hover);
      }
      .btn-deny {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-deny:hover {
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Authorize {{ .ClientName }}</h1>
      <p>This application is requesting access to your account.</p>

      {{ if .Scopes }}
      <ul class="scopes">
        {{ range .Scopes }}
        <li>{{ . }}</li>
        {{ end }}
      </ul>
      {{ end }}

      <form method="POST" action="/oauth2/authorize">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
        <input type="hidden" name="client_id" value="{{ .ClientID }}" />
        <input type="hidden" name="redirect_uri" value="{{ .RedirectURI }}" />
        <input type="hidden" name="state" value="{{ .State }}" />
        <input type="hidden" name="nonce" value="{{ .Nonce }}" />
        <input type="hidden" name="scope" value="{{ .Scope }}" />
        <input type="hidden" name="code_challenge" value="{{ .Challenge }}" />
        <input
          type="hidden"
          name="code_challenge_method"
          value="{{ .Method }}"
        />

        <div class="actions">
          <button class="btn btn-deny" name="decision" value="deny">
            Deny
          </button>
          <button class="btn btn-allow" name="decision" value="allow">
            Allow
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
