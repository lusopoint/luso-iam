{{define "title"}}Authorize {{ .ClientName }} - IAM{{end}} {{define "content"}}
<main class="card">
  <h1>Authorize {{ .ClientName }}</h1>
  <p class="subtitle">This application is requesting access to your account.</p>

  {{ if .Scopes }}
  <ul class="scopes">
    {{ range .Scopes }}
    <li>{{ . }}</li>
    {{ end }}
  </ul>
  {{ end }}

  <form method="POST" action="/oauth2/authorize">
    <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
    <input type="hidden" name="client_id" value="{{ .ClientID }}" />
    <input type="hidden" name="redirect_uri" value="{{ .RedirectURI }}" />
    <input type="hidden" name="state" value="{{ .State }}" />
    <input type="hidden" name="nonce" value="{{ .Nonce }}" />
    <input type="hidden" name="scope" value="{{ .Scope }}" />
    <input type="hidden" name="code_challenge" value="{{ .Challenge }}" />
    <input type="hidden" name="code_challenge_method" value="{{ .Method }}" />

    <div class="actions">
      <button class="btn btn-deny" name="decision" value="deny">Deny</button>
      <button class="btn btn-allow" name="decision" value="allow">Allow</button>
    </div>
  </form>
</main>
{{end}}
