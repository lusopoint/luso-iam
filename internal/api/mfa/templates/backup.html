{{define "title"}}Backup code - IAM{{end}} {{define "content"}}
<main class="card">
  <h1>Backup code</h1>
  <p class="subtitle">
    Enter one of the codes you saved when you set up two-factor authentication.
  </p>

  {{ if .Error }}
  <div class="error" role="alert">{{ .Error }}</div>
  {{ end }}

  <form method="POST" action="/mfa/backup">
    <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
    <div class="field">
      <label for="code">Backup code</label>
      <input
        type="text"
        id="code"
        name="code"
        required
        autofocus
        autocomplete="one-time-code"
        placeholder="ABCD-EFGH"
      />
    </div>
    <button class="btn" type="submit">Verify</button>
  </form>

  <p class="alt"><a href="/mfa">← Back to authenticator</a></p>
</main>
{{end}}
