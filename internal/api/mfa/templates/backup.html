<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Use a backup code - IAM</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #b91c1c;
        --error-bg: #fef2f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #161922;
          --border: #2a2f3a;
          --text: #e6e8eb;
          --muted: #9aa1ab;
          --error: #fca5a5;
          --error-bg: #3f1c1c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
        width: 100%;
        max-width: 380px;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.3rem;
      }
      .subtitle {
        color: var(--muted);
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
      }
      .error {
        background: var(--error-bg);
        color: var(--error);
        padding: 0.55rem 0.7rem;
        border-radius: 6px;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      .field {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.35rem;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.55rem 0.7rem;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-align: center;
        font-size: 1.05rem;
      }
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      .btn {
        width: 100%;
        padding: 0.6rem;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .alt {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .alt a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Backup code</h1>
      <p class="subtitle">
        Enter one of the codes you saved when you set up two-factor
        authentication.
      </p>

      {{ if .Error }}
      <div class="error" role="alert">{{ .Error }}</div>
      {{ end }}

      <form method="POST" action="/mfa/backup">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
        <div class="field">
          <label for="code">Backup code</label>
          <input
            type="text"
            id="code"
            name="code"
            required
            autofocus
            autocomplete="one-time-code"
            placeholder="ABCD-EFGH"
          />
        </div>
        <button class="btn" type="submit">Verify</button>
      </form>

      <p class="alt">
        <a href="/mfa">← Back to authenticator</a>
      </p>
    </main>
  </body>
</html>
