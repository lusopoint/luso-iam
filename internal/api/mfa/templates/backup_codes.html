{{define "title"}}Backup codes - IAM{{end}} {{define "content"}}
<main class="card">
  <h1>Backup codes</h1>
  <p class="subtitle">
    Use any of these codes once to sign in if you lose your authenticator.
  </p>

  <div class="warn">
    <strong>Save these somewhere safe.</strong> They will not be shown again.
  </div>

  <div class="codes">
    {{ range .Codes }}
    <div>{{ . }}</div>
    {{ end }}
  </div>

  <div class="actions">
    <button class="btn-secondary" type="button" id="copy-codes">Copy</button>
    <a class="btn" href="/mfa/enroll">Done</a>
  </div>
</main>
{{end}} {{define "scripts"}}
<script>
  // Codes are already in the DOM; this just saves the user transcribing them.
  // If the clipboard API is unavailable (insecure origin, denied permission)
  // the button quietly does nothing and the codes remain readable on screen.
  document.getElementById("copy-codes").addEventListener("click", function () {
    const btn = this;
    const codes = Array.from(document.querySelectorAll(".codes div"))
      .map((d) => d.textContent.trim())
      .join("\n");

    navigator.clipboard.writeText(codes).then(function () {
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = orig), 2000);
    });
  });
</script>
{{end}}
