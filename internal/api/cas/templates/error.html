<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign-in error · IAM</title>
    <style>
        :root {
            --bg: #f4f5f7; --card: #ffffff; --border: #e3e6ea;
            --text: #1f2328; --muted: #6b7280; --accent: #2563eb;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f1115; --card: #161922; --border: #2a2f3a;
                    --text: #e6e8eb; --muted: #9aa1ab; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 1rem; min-height: 100vh;
            background: var(--bg); color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 2rem; max-width: 480px;
        }
        h1 { margin: 0 0 .5rem; font-size: 1.3rem; }
        p { color: var(--muted); margin: 0 0 .75rem; }
        a { color: var(--accent); }
        code { font-size: .85rem; word-break: break-all; }
    </style>
</head>
<body>
    <main class="card">
        <h1>{{ .Title }}</h1>
        <p>{{ .Message }}</p>
        {{ if .Detail }}<p><code>{{ .Detail }}</code></p>{{ end }}
    </main>
</body>
</html>
