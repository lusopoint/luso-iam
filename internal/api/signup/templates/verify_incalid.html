<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link expired · IAM</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #161922;
          --border: #2a2f3a;
          --text: #e6e8eb;
          --muted: #9aa1ab;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 1rem;
        font-size: 0.9rem;
      }
      .back {
        display: block;
        margin-top: 14px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
      }
      .back:hover {
        color: var(--text);
      }
      a.btn {
        display: block;
        padding: 10px 12px;
        font-weight: 600;
        background: var(--accent);
        color: white;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
      }
      a.btn:hover {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Link is invalid or expired</h1>
      <p class="sub">
        This confirmation link is no longer valid. It may have expired, already
        been used, or been replaced by a newer one.
      </p>
      <p class="sub">
        If you have an account, you can sign in below, your account may already
        be active.
      </p>
      <a class="btn" href="/cas/login">Sign in</a>
    </div>
  </body>
</html>
