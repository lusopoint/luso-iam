{{define "title"}}Check your inbox - IAM{{end}} {{define "content"}}
<main class="card">
  <h1>Check your inbox</h1>
  <p class="subtitle">
    We sent a confirmation link to <strong>{{ .Email }}</strong>. Click the link
    to activate your account.
  </p>

  <div class="notice">
    The link expires in {{ .ExpiryHours }} hours. Didn't get the email? Check
    spam.
  </div>

  <a class="back" href="/cas/login">← Back to sign in</a>
</main>
{{end}}
