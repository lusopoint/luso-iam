{{define "title"}}Create an account - IAM{{end}} {{define "content"}}
<main class="card">
  <h1>Create an account</h1>
  <p class="subtitle">Sign up with your email and a password.</p>

  {{ if .Error }}
  <div class="error" role="alert">{{ .Error }}</div>
  {{ end }}

  <form method="post" action="/signup" autocomplete="off">
    <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
    <div class="field">
      <label for="first_name">First name</label>
      <input
        id="first_name"
        type="text"
        name="first_name"
        required
        autofocus
        autocomplete="given-name"
        maxlength="100"
        value="{{ .FirstName }}"
      />
    </div>

    <div class="field">
      <label for="last_name">Last name</label>
      <input
        id="last_name"
        type="text"
        name="last_name"
        required
        autocomplete="family-name"
        maxlength="100"
        value="{{ .LastName }}"
      />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        required
        autofocus="email"
        value="{{ .Email }}"
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        required
        minlength="{{ .MinPasswordLength }}"
      />
      <p class="hint">At least {{ .MinPasswordLength }} characters.</p>
    </div>

    <button class="btn" type="submit">Create account</button>
  </form>

  <a class="back" href="/cas/login">← Back to sign in</a>
</main>
{{end}}
