<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · IAM</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1f2328;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --error: #b91c1c;
        --error-bg: #fef2f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #161922;
          --border: #2a2f3a;
          --text: #e6e8eb;
          --muted: #9aa1ab;
          --error: #fca5a5;
          --error-bg: #3f1c1c;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px 28px 24px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 1.25rem;
        font-size: 0.9rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: var(--muted);
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 14px;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
        border-color: var(--accent);
      }
      button {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      .error {
        color: var(--error);
        background: var(--error-bg);
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }
      .hint {
        color: var(--muted);
        font-size: 0.8rem;
        margin: -8px 0 14px;
      }
      .back {
        display: block;
        margin-top: 14px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: none;
      }
      .back:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create an account</h1>
      <p class="sub">Sign up with your email and a password.</p>
      {{ if .Error }}
      <div class="error">{{ .Error }}</div>
      {{ end }}
      <form method="post" action="/signup" autocomplete="off">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}" />
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          required
          autofocus
          value="{{ .Email }}"
        />
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          required
          minlength="{{ .MinPasswordLength }}"
        />
        <p class="hint">At least {{ .MinPasswordLength }} characters.</p>
        <button type="submit">Create account</button>
      </form>
      <a class="back" href="/cas/login">Back to sign in</a>
    </div>
  </body>
</html>
